# ==============================================================================
# slack-therm.conf — Configuration for slack-therm.sh
# Generated by slack-therm-setup.sh
#
# Edit manually or re-run slack-therm-setup.sh to reconfigure.
# ==============================================================================

# ──── Hardware monitor aliases ─────────────────────────────────────────────
CPU="hwmon5"
MOBO="hwmon1"
NVME="hwmon3"

# ──── Temperature sensors ────────────────────────────────────────────────────

TEMP_RAW_LOC[0]="/sys/class/hwmon/${MOBO}/temp1_input"
TEMP_RAW_DIV[0]="1000"
TEMP_COOL[0]="37"
TEMP_WARM[0]="47"
TEMP_HOT[0]="57"
TEMP_LABEL[0]="Unknown"

TEMP_RAW_LOC[1]="/sys/class/hwmon/${NVME}/temp1_input"
TEMP_RAW_DIV[1]="1000"
TEMP_COOL[1]="33"
TEMP_WARM[1]="43"
TEMP_HOT[1]="53"
TEMP_LABEL[1]="NVMe"

TEMP_RAW_LOC[2]="/sys/class/hwmon/${CPU}/temp1_input"
TEMP_RAW_DIV[2]="1000"
TEMP_COOL[2]="47"
TEMP_WARM[2]="57"
TEMP_HOT[2]="67"
TEMP_LABEL[2]="Package"

TEMP_RAW_LOC[3]="/sys/class/hwmon/${CPU}/temp2_input"
TEMP_RAW_DIV[3]="1000"
TEMP_COOL[3]="47"
TEMP_WARM[3]="57"
TEMP_HOT[3]="67"
TEMP_LABEL[3]="Core 0"

# ──── Fan sensors ────────────────────────────────────────────────────────────

# ──── Refresh interval ───────────────────────────────────────────────────────
SLEEP_TIME=1

# ──── CPU frequency color thresholds (MHz) ───────────────────────────────────
FREQ_LOW="2200"
FREQ_MID="3200"
FREQ_HIGH="4000"

# ──── CPU frequency raw divisor ──────────────────────────────────────────────
FREQ_RAW_DIV="1000"
